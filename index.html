<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Collection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.typekit.net/kit7jyr.css">
</head>
<body>
    <header>
        <p class="collection-title">Movie Collection</p>
        <h1>movies</h1>
    </header>

    <main>
        <section class="filter-section">
            <p class="filter-label">Explore by genre</p>
            <ul class="filters">
                <li data-genre="all" class="filter genreFilter selected">
                    All
                </li>

                <li data-genre="comedy" class="filter genreFilter">
                    Comedy
                </li>

                <li data-genre="romance" class="filter genreFilter">
                    Romance
                </li>

                <li data-genre="action" class="filter genreFilter">
                    Action
                </li>

                <li data-genre="adventure" class="filter genreFilter">
                    Adventure
                </li>

                <li data-genre="science fiction" class="filter genreFilter">
                    Science Fiction
                </li>

                <li data-genre="fantasy" class="filter genreFilter">
                    Fantasy
                </li>

                <li data-genre="family" class="filter genreFilter">
                    Family
                </li>

                <li data-genre="drama" class="filter genreFilter">
                    Drama
                </li>

                <li data-genre="horror" class="filter genreFilter">
                    Horror
                </li>

                <li data-genre="coming of age" class="filter genreFilter">
                    Coming of Age
                </li>

            </ul>
        </section>
        <section id="movies"></section>
    </main>

    <footer>
        <p>Movie Collection</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
